spring.application.name=banking-integration-service

spring.datasource.url=jdbc:h2:mem:bankdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.defer-datasource-initialization=true
external.api.client-secret=${EXTERNAL_API_CLIENT_SECRET:}

spring.cloud.azure.servicebus.namespace=gbank-servicebus-san
app.servicebus.fraud-queue=fraud-processing-queue